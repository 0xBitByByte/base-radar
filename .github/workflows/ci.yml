name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # PR-097.06 (Production Readiness) — pinned to the exact version
          # `Dockerfile` deploys (node:22.23.1-slim), not a floating "22"
          # tag. `Dockerfile`'s own comment already claimed "this repo's
          # own CI ... already run[s] 22.23.1" as the reason for pinning
          # the runtime image — that claim wasn't actually true until this
          # pin, since a floating major-version tag can silently resolve
          # to a newer 22.x than the image ships. Matters specifically
          # because `node:sqlite` (`lib/backend/sqlite/db.ts`) is still an
          # experimental, version-sensitive Node API.
          node-version: "22.23.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        # PR-097.06 (Production Readiness) — `--omit=dev` scopes this to
        # the dependency tree that actually reaches the deployed server,
        # not devDependency-only findings (Playwright, ESLint, etc.) that
        # never ship. `continue-on-error` because a new advisory in a
        # transitive dependency (e.g. one `next` itself pins, like
        # `baseline-browser-mapping` — see docs/DEPLOYMENT.md) is real
        # information worth surfacing in every run, but isn't something a
        # code change here can always immediately fix, so it must not
        # block merges the way a real test/type/lint failure should.
        run: npm audit --omit=dev
        continue-on-error: true

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E and visual regression tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
